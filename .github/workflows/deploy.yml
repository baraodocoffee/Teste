name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/code-vs-prompt-diff-LbY6J, claude/ola-2k7uN]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            simulador-aposentadoria/package-lock.json
            calculadora-independencia/package-lock.json
            comparador-renda-fixa/package-lock.json
            simulador-pgbl/package-lock.json

      - name: Build simulador de aposentadoria
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: simulador-aposentadoria

      - name: Build calculadora de independência
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: calculadora-independencia

      - name: Build comparador de renda fixa
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: comparador-renda-fixa

      - name: Build simulador PGBL
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: simulador-pgbl

      - name: Montar estrutura de páginas
        run: |
          mkdir -p _pages/simulador-aposentadoria _pages/calculadora-independencia _pages/comparador-renda-fixa _pages/simulador-pgbl
          cp -r simulador-aposentadoria/dist/* _pages/simulador-aposentadoria/
          cp -r calculadora-independencia/dist/* _pages/calculadora-independencia/
          cp -r comparador-renda-fixa/dist/* _pages/comparador-renda-fixa/
          cp -r simulador-pgbl/dist/* _pages/simulador-pgbl/
          cp index.html _pages/index.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - uses: actions/deploy-pages@v4
        id: deployment
