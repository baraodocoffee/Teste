name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/code-vs-prompt-diff-LbY6J]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build simulador de aposentadoria
        run: npm ci && npm run build
        working-directory: simulador-aposentadoria

      - name: Build calculadora de independência
        run: npm ci && npm run build
        working-directory: calculadora-independencia

      - name: Montar estrutura de páginas
        run: |
          mkdir -p _pages/simulador-aposentadoria _pages/calculadora-independencia
          cp -r simulador-aposentadoria/dist/* _pages/simulador-aposentadoria/
          cp -r calculadora-independencia/dist/* _pages/calculadora-independencia/
          cp index.html _pages/index.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - uses: actions/deploy-pages@v4
        id: deployment
