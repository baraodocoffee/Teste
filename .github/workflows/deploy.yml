name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/code-vs-prompt-diff-LbY6J]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: simulador-aposentadoria/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: simulador-aposentadoria

      - name: Build
        run: npm run build
        working-directory: simulador-aposentadoria

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: simulador-aposentadoria/dist

      - uses: actions/deploy-pages@v4
        id: deployment
